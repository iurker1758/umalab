[project]
name = "umalab-backend"
version = "0.1.0"
description = "UmaLab API — Uma Musume roster tracking and breeding tools"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "python-multipart>=0.0.9",  # multipart parsing for the data.json upload endpoint
    # Cloudflare Access identity (DECISIONS.md #33): [crypto] pulls the RSA
    # backend PyJWT needs to verify Access's RS256 signatures, and httpx
    # fetches the team's JWKS. Runtime deps, not dev — the verifier IS the
    # security boundary.
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    # Pinned exact: pyright releases weekly and new versions add new errors;
    # upgrades should be deliberate, not a surprise CI break.
    "pyright==1.1.411",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
# DTZ and ASYNC enforce repo invariants (no naive clock reads; no blocking
# calls in async paths); the rest are low-noise quality sets.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PT", "DTZ", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates these; don't fight the generator's formatting.
"alembic/versions/*" = ["E501", "I001"]

[tool.pyright]
include = ["app", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
